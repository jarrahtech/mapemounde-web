<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mapemounde — Traveller</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-generator="traveller">
    <header>
      <p class="crumb"><a href="index.html">← Mapemounde</a></p>
      <h1>Traveller (Classic)</h1>
      <p class="source">
        Generated with the <em>World Creation</em> rules of the Classic Traveller book <a href="https://www.drivethrurpg.com/en/product/80179/classic-traveller-ct-b03-worlds-and-adventures" target="_blank" rel="noopener"><cite>Book 3: Worlds and Adventures</cite></a> (Game Designers’ Workshop, 1977/1981).<br />
        <a href="traveller-differences.html">How this differs from the book →</a>
      </p>
    </header>

    <main>
      <form id="form">
        <div class="row" data-dev-only>
          <label for="apiBase">API base</label>
          <!-- Dev only: value is set by apiBase.js (?api= → saved → default) and remembered across visits and pages. In prod it is fixed and this row is hidden. -->
          <input id="apiBase" type="text" placeholder="http://localhost:8080" spellcheck="false" />
        </div>

        <div class="row">
          <label for="seed">Seed</label>
          <input id="seed" type="text" value="42" spellcheck="false" />
        </div>

        <div class="row actions">
          <button type="submit" title="Generate the system for this seed">Generate</button>
          <button type="button" id="random" class="ghost" title="Roll a random seed and generate (shortcut: R)">🎲 Random</button>
          <span id="status" class="status"></span>
        </div>
      </form>

      <section id="result" hidden>
        <div id="rendered"></div>
        <div class="hex-controls">
          <label for="systemName">Name</label>
          <!-- Display-only label drawn inside the hex; client-side, never sent to the API. -->
          <input id="systemName" type="text" placeholder="System name" spellcheck="false" maxlength="40" />
          <button type="button" id="downloadSvg" class="ghost" title="Download the hex as an SVG">⬇ Download SVG</button>
        </div>
        <details>
          <summary>Raw JSON</summary>
          <pre id="raw"></pre>
        </details>
      </section>
    </main>

    <script src="apiBase.js"></script>
    <script src="app.js"></script>
  </body>
</html>
