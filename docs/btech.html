<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mapemounde — BattleTech</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-generator="btech">
    <header>
      <p class="crumb"><a href="index.html">← Mapemounde</a></p>
      <h1>BattleTech</h1>
      <p class="subtitle">A BattleTech star system, with a selectable stellar bias.</p>
    </header>

    <main>
      <form id="form">
        <div class="row">
          <label for="apiBase">API base</label>
          <!-- Value is set by apiBase.js (?api= → saved → default); remembered across visits and pages. -->
          <input id="apiBase" type="text" placeholder="http://localhost:8080" spellcheck="false" />
        </div>

        <div class="row">
          <label for="seed">Seed</label>
          <input id="seed" type="text" value="42" spellcheck="false" />
          <button type="button" id="randomSeed" class="ghost" title="Random seed">🎲</button>
        </div>

        <div class="row">
          <label for="starType">Star type</label>
          <select id="starType" data-param="starType">
            <option value="Realistic">Realistic</option>
            <option value="LifeFriendly">LifeFriendly</option>
            <option value="HotStars">HotStars</option>
          </select>
        </div>

        <div class="row actions">
          <button type="submit">Generate</button>
          <span id="status" class="status"></span>
        </div>
      </form>

      <section id="result" hidden>
        <div id="rendered"></div>
        <details>
          <summary>Raw JSON</summary>
          <pre id="raw"></pre>
        </details>
      </section>
    </main>

    <script src="apiBase.js"></script>
    <script src="app.js"></script>
  </body>
</html>
