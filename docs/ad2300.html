<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mapemounde — 2300 AD</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-generator="ad2300">
    <header>
      <p class="crumb"><a href="index.html">← Mapemounde</a></p>
      <h1>2300 AD</h1>
      <p class="source">
        Generated with the <em>World Generation</em> rules of the 2300 AD book <a href="https://www.drivethrurpg.com/en/product/413/2300-ad-man-s-battle-for-the-stars" target="_blank" rel="noopener"><cite>2300 AD: Man’s Battle for the Stars</cite></a> (Game Designers’ Workshop, 1988).<br />
        <a href="ad2300-differences.html">How this differs from the book →</a>
      </p>
    </header>

    <main>
      <form id="form">
        <div class="row" data-dev-only>
          <label for="apiBase">API base</label>
          <!-- Dev only: value is set by apiBase.js (?api= → saved → default) and remembered across visits and pages. In prod it is fixed and this row is hidden. -->
          <input id="apiBase" type="text" placeholder="http://localhost:8080" spellcheck="false" />
        </div>

        <div class="row">
          <label for="seed">Seed</label>
          <input id="seed" type="text" value="42" spellcheck="false" />
        </div>

        <div class="row actions">
          <button type="submit" title="Generate the system for this seed">Generate</button>
          <button type="button" id="random" class="ghost" title="Roll a random seed and generate (shortcut: R)">🎲 Random</button>
          <span id="status" class="status"></span>
        </div>
      </form>

      <section id="result" hidden>
        <div id="rendered"></div>
        <details>
          <summary>Raw JSON</summary>
          <pre id="raw"></pre>
        </details>
      </section>
    </main>

    <script src="apiBase.js"></script>
    <script src="app.js"></script>
  </body>
</html>
